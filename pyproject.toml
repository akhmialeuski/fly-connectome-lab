[project]
name = "flystate"
version = "0.1.0.dev0"
description = "Reproducible sequential visual memory experiments on MaleCNS."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "flybrain==0.1.0",
    "numpy>=2.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "psutil>=5.9",
    "threadpoolctl>=3.7.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380",
    "pre-commit>=3.7", "mypy>=1.11", "flake8>=7", "types-PyYAML", "types-psutil",
]

[project.scripts]
flystate = "flystate.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flystate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN"]
ignore = ["ANN401"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "connectome: needs real brain files and FLYSTATE_REAL_BRAIN=1",
    "slow: longer than ten seconds",
]

[tool.coverage.run]
source = ["flystate"]
branch = true

[tool.uv]
link-mode = "copy"
